# FSI Agentic Lending - Staging Environment Configuration
# Unified pod deployment: Frontend + Backend sidecar
# Environment: Staging

# Frontend main container environment variables
env:
  NODE_ENV: production
  PORT: '8080'
  HOSTNAME: '0.0.0.0'
  # Server-side backend URL for Next.js rewrites (internal pod communication)
  # WebSocket is proxied by server.mjs to this same URL on upgrade requests
  NEXT_PUBLIC_BACKEND_URL: http://localhost:8000

# Sidecar container (backend)
sidecarContainers:
  # Lending Backend (port 8000)
  - name: backend
    image: 795250896452.dkr.ecr.us-east-1.amazonaws.com/industrysolutions/fsi-agentic-lending-backend:latest
    imagePullPolicy: Always
    ports:
      - containerPort: 8000
        name: backend-api
    resources:
      requests:
        memory: '256Mi'
        cpu: '100m'
      limits:
        memory: '750Mi'
        cpu: '350m'
    env:
      - name: PORT
        value: '8000'
      - name: HOST
        value: '0.0.0.0'
      - name: PYTHONUNBUFFERED
        value: '1'
      # AWS Configuration (IRSA - no keys needed)
      - name: AWS_REGION
        value: 'us-east-1'
      - name: AWS_USE_SSO
        value: 'false'
      # CORS origins
      - name: ORIGINS
        value: 'http://localhost:8080'
      # MongoDB Configuration (from secrets)
      - name: MONGODB_URI
        valueFrom:
          secretKeyRef:
            name: fsi-agentic-lending-secrets
            key: MONGODB_URI
      - name: DATABASE_NAME
        valueFrom:
          secretKeyRef:
            name: fsi-agentic-lending-secrets
            key: DATABASE_NAME
      - name: VOYAGE_API_KEY
        valueFrom:
          secretKeyRef:
            name: fsi-agentic-lending-secrets
            key: VOYAGE_API_KEY
      - name: CHATCOMPLETIONS_MODEL_ID
        valueFrom:
          secretKeyRef:
            name: fsi-agentic-lending-secrets
            key: CHATCOMPLETIONS_MODEL_ID
      # Collection-name indirection: the shared leafy_bank_bian database stores
      # the demo's collections under a `lending` prefix (documents -> lendingDocuments,
      # applications -> loans, payments -> loanRepayments, ...). Without these
      # COLL_* overrides the app resolves to plain names that do not exist there
      # and every collection reads empty. DATABASE_NAME must be leafy_bank_bian.
      - name: COLL_BORROWERS
        value: 'customers'
      - name: COLL_DOCUMENTS
        value: 'lendingDocuments'
      - name: COLL_CREDIT_REPORTS
        value: 'creditReports'
      - name: COLL_PAYMENTS
        value: 'loanRepayments'
      - name: COLL_UNDERWRITING_POLICIES
        value: 'lendingUnderwritingPolicies'
      - name: COLL_AGENT_ACTIVITY
        value: 'lendingAgentActivity'
      - name: COLL_CONVERSATIONS
        value: 'lendingConversations'
      - name: COLL_INTERVENTIONS
        value: 'lendingInterventions'
      - name: COLL_HITL_AUDIT
        value: 'lendingHitlAudit'
      - name: COLL_OFFICERS
        value: 'lendingOfficers'
      - name: COLL_PIPELINE_LOCKS
        value: 'lendingPipelineLocks'
      - name: COLL_RENEWALS
        value: 'lendingRenewals'

# Service mesh
mesh:
  enabled: true

# Service Account with IRSA for AWS Bedrock access
serviceAccount:
  enabled: true
  irsa:
    accountId: '275662791714'
    roleName: 'kanopy-staging-cicd-irsa'

# Kanopy security and ownership (requires web-app chart v4.30.0+)
security:
  dataClassification: "Internal"
  dataDesignation:
    - "MI"

ownership:
  driEmail: mehar.grewal@mongodb.com
