# FSI Agentic Lending - Unified Pod Deployment
# Deploys frontend + backend as 2 containers in same pod

kind: pipeline
type: kubernetes
name: staging

trigger:
  branch:
    - staging

steps:
  # Step 1: Build Frontend Image
  - name: publish-frontend
    image: plugins/kaniko-ecr
    settings:
      create_repository: true
      registry: 795250896452.dkr.ecr.us-east-1.amazonaws.com
      repo: industrysolutions/fsi-agentic-lending-frontend
      tags:
        - git-${DRONE_COMMIT_SHA:0:7}
        - latest
      dockerfile: Dockerfile.frontend
      access_key:
        from_secret: ecr_access_key
      secret_key:
        from_secret: ecr_secret_key
    when:
      event:
        - push

  # Step 2: Build Backend Image
  - name: publish-backend
    image: plugins/kaniko-ecr
    settings:
      create_repository: true
      registry: 795250896452.dkr.ecr.us-east-1.amazonaws.com
      repo: industrysolutions/fsi-agentic-lending-backend
      tags:
        - git-${DRONE_COMMIT_SHA:0:7}
        - latest
      dockerfile: Dockerfile.backend
      access_key:
        from_secret: ecr_access_key
      secret_key:
        from_secret: ecr_secret_key
    when:
      event:
        - push

  # Step 3: Deploy Combined Pod to Staging
  - name: deploy-staging
    image: public.ecr.aws/kanopy/drone-helm:v3
    settings:
      chart: mongodb/web-app
      chart_version: 4.30.0
      add_repos: [mongodb=https://10gen.github.io/helm-charts]
      namespace: industrysolutions
      release: fsi-agentic-lending
      values:
        # Frontend main container
        - 'image.repository=795250896452.dkr.ecr.us-east-1.amazonaws.com/industrysolutions/fsi-agentic-lending-frontend'
        - 'image.tag=git-${DRONE_COMMIT_SHA:0:7}'
        # Ingress configuration
        - 'ingress.enabled=true'
        - 'ingress.hosts[0]=fsi-agentic-lending.industrysolutions.staging.corp.mongodb.com'
        # WebSocket support via nginx ingress
        - 'ingress.annotations.nginx\.ingress\.kubernetes\.io/proxy-read-timeout="3600"'
        - 'ingress.annotations.nginx\.ingress\.kubernetes\.io/proxy-send-timeout="3600"'
        - 'ingress.annotations.nginx\.ingress\.kubernetes\.io/proxy-http-version="1.1"'
        # Service mesh
        - 'mesh.enabled=true'
        # Resource limits for frontend
        - 'resources.limits.cpu=500m'
        - 'resources.limits.memory=600Mi'
        - 'resources.requests.cpu=100m'
        - 'resources.requests.memory=150Mi'
        # Sidecar: Backend
        - 'sidecarContainers[0].name=backend'
        - 'sidecarContainers[0].image=795250896452.dkr.ecr.us-east-1.amazonaws.com/industrysolutions/fsi-agentic-lending-backend:git-${DRONE_COMMIT_SHA:0:7}'
        - 'sidecarContainers[0].ports[0].containerPort=8000'
        - 'sidecarContainers[0].ports[0].name=backend-api'
        - 'sidecarContainers[0].resources.limits.cpu=350m'
        - 'sidecarContainers[0].resources.limits.memory=750Mi'
        - 'sidecarContainers[0].resources.requests.cpu=100m'
        - 'sidecarContainers[0].resources.requests.memory=256Mi'
      api_server: https://api.staging.corp.mongodb.com
      kubernetes_token:
        from_secret: staging_kubernetes_token
      values_files: ['environment/staging-combined.yaml']
    when:
      event:
        - push

---
